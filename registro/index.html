<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <h1>Crear cuenta</h1>

    <!-- Nivel 1: SIN novalidate, para que el navegador valide solo -->
    <form id="registro" action="https://jsonplaceholder.typicode.com/posts" method="post">

      <label for="nombre">Nombre completo</label>
      <input id="nombre" name="nombre" type="text"
             required minlength="3" maxlength="60" autocomplete="name">

      <label for="email">Correo</label>
      <input id="email" name="email" type="email" required autocomplete="email">

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password"
             required minlength="8"
             pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
             title="Mínimo 8 caracteres, con al menos una letra y un número"
             autocomplete="new-password">

      <label for="confirmar">Confirmar contraseña</label>
      <input id="confirmar" name="confirmar" type="password"
             required minlength="8" autocomplete="new-password">

      <label for="edad">Edad</label>
      <input id="edad" name="edad" type="number"
             required min="18" max="120" step="1" inputmode="numeric">

      <label for="pais">País</label>
      <select id="pais" name="pais" required autocomplete="country-name">
        <option value="">Elige un país</option>
        <option value="CO">Colombia</option>
        <option value="AR">Argentina</option>
        <option value="CL">Chile</option>
        <option value="EC">Ecuador</option>
        <option value="ES">España</option>
        <option value="MX">México</option>
        <option value="PE">Perú</option>
        <option value="VE">Venezuela</option>
      </select>

      <div class="check">
        <input id="terminos" name="terminos" type="checkbox" required>
        <label for="terminos">Acepto los términos y condiciones</label>
      </div>

      <button type="submit">Crear cuenta</button>
      <p id="mensaje" role="status"></p>
    </form>
  </main>
</body>
</html>
