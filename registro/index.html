<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <h1>Crear cuenta</h1>

    <!-- Nivel 4: las reglas ya no están en el HTML, viven en validaciones.js -->
    <form id="registro" action="https://jsonplaceholder.typicode.com/posts" method="post" novalidate>

      <label for="nombre">Nombre completo</label>
      <input id="nombre" name="nombre" type="text"
             autocomplete="name"
             aria-describedby="nombre-error">
      <p id="nombre-error" class="error" aria-live="polite"></p>

      <label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="email"
             aria-describedby="email-error">
      <p id="email-error" class="error" aria-live="polite"></p>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password"
             autocomplete="new-password"
             aria-describedby="password-ayuda password-error">
      <p id="password-ayuda" class="ayuda">Mínimo 8 caracteres, con al menos una letra y un número.</p>
      <p id="password-error" class="error" aria-live="polite"></p>

      <label for="confirmar">Confirmar contraseña</label>
      <input id="confirmar" name="confirmar" type="password"
             autocomplete="new-password"
             aria-describedby="confirmar-error">
      <p id="confirmar-error" class="error" aria-live="polite"></p>

      <label for="edad">Edad</label>
      <input id="edad" name="edad" type="number"
             inputmode="numeric"
             aria-describedby="edad-error">
      <p id="edad-error" class="error" aria-live="polite"></p>

      <label for="pais">País</label>
      <select id="pais" name="pais" autocomplete="country-name"
              aria-describedby="pais-error">
        <option value="">Elige un país</option>
        <option value="CO">Colombia</option>
        <option value="AR">Argentina</option>
        <option value="CL">Chile</option>
        <option value="EC">Ecuador</option>
        <option value="ES">España</option>
        <option value="MX">México</option>
        <option value="PE">Perú</option>
        <option value="VE">Venezuela</option>
      </select>
      <p id="pais-error" class="error" aria-live="polite"></p>

      <div id="telefonos"></div>
      <p id="telefonos-error" class="error" aria-live="polite"></p>
      <button type="button" id="agregar-telefono">Agregar teléfono</button>

      <div class="check">
        <input id="terminos" name="terminos" type="checkbox"
               aria-describedby="terminos-error">
        <label for="terminos">Acepto los términos y condiciones</label>
      </div>
      <p id="terminos-error" class="error" aria-live="polite"></p>

      <button type="submit">Crear cuenta</button>
      <p id="mensaje" role="status"></p>
    </form>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
